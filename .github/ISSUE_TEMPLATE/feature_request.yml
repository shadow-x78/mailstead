# ─────────────────────────────────────────────
# Mailstead - Feature Request Template
# https://github.com/shadow-x78/mailstead
# ─────────────────────────────────────────────

name: Feature request
description: Suggest an improvement to Mailstead
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Mailstead is open source and non-commercial. Requests that add telemetry,
        tracking, or bulk-marketing sending are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Relevant distribution(s)
      placeholder: "Debian 12 / AlmaLinux 9"
    validations:
      required: false
